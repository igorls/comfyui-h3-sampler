[project]
name = "comfyui-h3-sampler"
description = "MiniMax H3 Image realism nodes for ComfyUI: Frequency-Split Spectral Re-Noising KSampler (6-step fast / 8-step max detail), Empty Picture T2I mode switch, distilled Sigmas, and a 96 MP+ Resolution Selector."
version = "2.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = ["Operating System :: OS Independent"]
dependencies = []

[project.urls]
Repository = "https://github.com/igorls/comfyui-h3-sampler"
Documentation = "https://github.com/igorls/comfyui-h3-sampler#readme"
"Bug Tracker" = "https://github.com/igorls/comfyui-h3-sampler/issues"

[tool.comfy]
# Fill in your publisher id from registry.comfy.org before `comfy node publish`.
PublisherId = ""
DisplayName = "H3 Realism Sampler"
Icon = ""
requires-comfyui = ">=0.45.0"
